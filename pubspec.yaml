name: tasks
description: Google Tasks UI for NYRO GATE Study Copilot.

version: 1.0.11+12

environment:
  sdk: ">=2.17.0 <4.0.0"

publish_to: none

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  intl: ^0.19.0
  community_material_icon: ^5.9.55
  flutter_markdown: ^0.7.4+1
  http: ^1.2.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  platform: ^3.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/google_fonts/
    - assets/data/nyro.db
